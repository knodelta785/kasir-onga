name: Build APK Kasir Onga

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK debug
        run: gradle assembleDebug --stacktrace

      - name: Unggah APK debug
        uses: actions/upload-artifact@v4
        with:
          name: kasir-onga-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Siapkan keystore rilis
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kasir-onga.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/kasir-onga.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK rilis
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then
            gradle assembleRelease --stacktrace
            cp app/build/outputs/apk/release/app-release.apk kasir-onga.apk
          else
            echo "Secret keystore belum diatur - build rilis dilewati."
          fi

      - name: Unggah APK rilis
        if: env.KEYSTORE_FILE != ''
        uses: actions/upload-artifact@v4
        with:
          name: kasir-onga-release-apk
          path: kasir-onga.apk

      - name: Terbitkan ke GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') && env.KEYSTORE_FILE != ''
        uses: softprops/action-gh-release@v2
        with:
          files: kasir-onga.apk
